# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# The generated SevenTerm.xcodeproj is not committed; this file is the source of truth.
name: SevenTerm

options:
  bundleIdPrefix: com.networkitout
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.99.2
  SevenTermCore:
    path: Packages/SevenTermCore

targets:
  SevenTerm:
    type: application
    platform: macOS
    sources:
      - SevenTerm
    dependencies:
      - package: SwiftTerm
      - package: SevenTermCore
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: "7 Term"
        PRODUCT_MODULE_NAME: SevenTerm
        PRODUCT_BUNDLE_IDENTIFIER: com.networkitout.seventerm
        CODE_SIGN_STYLE: Automatic
        # ssh needs ~/.ssh, agent sockets and /usr/bin/ssh, so no App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "7 Term"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
