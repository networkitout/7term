# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# The generated SevenTerm.xcodeproj is not committed; this file is the source of truth.
name: SevenTerm

options:
  bundleIdPrefix: com.networkitout
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Needed for synchronized folders (below): Xcode then picks up new files
  # under SevenTerm/ without regenerating the project.
  projectFormat: xcode16_0

settings:
  base:
    SWIFT_VERSION: "6.0"
    # tools/release.sh sets both for each release; these are the defaults.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple Developer team (Membership details on developer.apple.com).
    # Not secret: it's printed in every app you sign.
    DEVELOPMENT_TEAM: ""
    # Sparkle's public update key, from Sparkle's generate_keys (see
    # docs/releasing.md). Empty disables update checks in local builds.
    SPARKLE_PUBLIC_KEY: ""

packages:
  # Exact versions: a release build is reproducible from its commit.
  # Package.resolved at the repo root pins SwiftTerm's own dependencies too;
  # the release script copies it into the generated project. To update,
  # change the version here, build once, and commit the new Package.resolved.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.2
  # Updates: "Check for Updates…" and automatic checks.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  SevenTermCore:
    path: Packages/SevenTermCore

targets:
  SevenTerm:
    type: application
    platform: macOS
    sources:
      - path: SevenTerm
        type: syncedFolder
    dependencies:
      - package: SwiftTerm
      - package: SevenTermCore
      - package: Sparkle
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: "7 Term"
        PRODUCT_MODULE_NAME: SevenTerm
        PRODUCT_BUNDLE_IDENTIFIER: com.networkitout.seventerm
        CODE_SIGN_STYLE: Automatic
        # ssh needs ~/.ssh, agent sockets and /usr/bin/ssh, so no App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's keys and the copyright; merged with the generated keys.
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "7 Term"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
